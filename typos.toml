[default.extend-words]
# Technical words
edn = "edn"
datas = "datas"
juxt = "juxt"
Ded = "Ded"         # Shows up in ANDed
referer = "referer" # This is a misspelling in the http spec so not much we can do
WRONLY = "WRONLY"

# False positives
collapsable = "collapsable" # This an ok alternative to collapsible
BA = "BA"
fo = "fo"
aks = "aks"
Mannor = "Mannor"
nd = "nd"
deleteable = "deleteable"
fom = "fom"
tne = "tne"
Damon = "Damon"
fnd = "fnd"         # Footnote anchor ids in HTML export
[files]
extend-exclude = ["resources/*",
                  "src/resources/*",
                  "scripts/resources/*",
                  "src/test/fixtures/*",
                  "deps/db-sync/test/logseq/db_sync/fixtures/*.edn",
                  "clj-e2e/resources/*",
                  "deps/common/src/logseq/common/plural.cljs",
                  # Generated files: Xcode object ids, lockfile hashes, base64 assets
                  "*.pbxproj",
                  "*.storyboard",
                  "pnpm-lock.yaml",
                  "deps/db-sync/worker/logseq_icon.mjs",
                  "src/test/migration/*.transit"]
