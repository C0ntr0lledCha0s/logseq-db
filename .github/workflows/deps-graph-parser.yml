name: logseq/graph-parser CI

on:
  # Path filters ensure jobs only kick off if a change is made to graph-parser or
  # its local dependencies
  push:
    branches: [master]
    paths:
      - 'deps/graph-parser/**'
      - '.github/workflows/deps-graph-parser.yml'
      - '!deps/graph-parser/**.md'
      # Deps that logseq/graph-parser depends on should trigger this workflow
      - 'deps/db/**'
      - 'deps/common/**'
  pull_request:
    branches: [master]
    paths:
      - 'deps/graph-parser/**'
      - '.github/workflows/deps-graph-parser.yml'
      - '!deps/graph-parser/**.md'
      # Deps that logseq/graph-parser depends on should trigger this workflow
      - 'deps/db/**'
      - 'deps/common/**'

defaults:
  run:
    working-directory: deps/graph-parser

env:
  CLOJURE_VERSION: '1.12.4.1618'
  # This is the same as 1.8.
  JAVA_VERSION: '21'
  # This is the latest node version we can run.
  NODE_VERSION: '24'
  BABASHKA_VERSION: '1.12.215'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: deps/graph-parser/pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: ${{ env.CLOJURE_VERSION }}
          bb: ${{ env.BABASHKA_VERSION }}

      - name: Clojure cache
        uses: actions/cache@v6
        id: clojure-deps
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-clojure-deps-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-clojure-deps-

      - name: Fetch Clojure deps
        if: steps.clojure-deps.outputs.cache-hit != 'true'
        run: clojure -P -M:test

      - name: Fetch pnpm deps
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Run nbb-logseq tests
        run: pnpm test

      # In this job because it depends on an npm package
      - name: Load namespaces into nbb-logseq
        run: bb test:load-all-namespaces-with-nbb .

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: ${{ env.CLOJURE_VERSION }}
          bb: ${{ env.BABASHKA_VERSION }}

      - name: Run clj-kondo lint
        run: clojure -M:clj-kondo --parallel --lint src test

      - name: Carve lint for unused vars
        run: bb lint:carve

      - name: Lint for vars that are too large
        run: bb lint:large-vars

      - name: Lint for namespaces that aren't documented
        run: bb lint:ns-docstrings
